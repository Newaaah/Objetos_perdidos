<div class="container pagina">
  <div class="encabezado-pagina">
    <div class="icono"><i class="bi bi-shield-check"></i></div>
    <div>
      <h1>Panel de administración</h1>
      <p>Configura el sistema y supervisa la gestión de objetos.</p>
    </div>
  </div>

  <div class="row g-4">
    @for (s of secciones; track s.titulo) {
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex flex-column">
            <h5 class="text-upeu-primary mb-3"><i class="bi {{ s.icono }} me-1"></i> {{ s.titulo }}</h5>
            <p class="small text-muted flex-grow-1">{{ s.descripcion }}</p>
            @if (s.ruta) {
              <a class="btn btn-upeu w-100" [routerLink]="s.ruta">Abrir</a>
            } @else {
              <button class="btn btn-upeu w-100" disabled>Próximamente</button>
            }
          </div>
        </div>
      </div>
    }
  </div>
</div>
