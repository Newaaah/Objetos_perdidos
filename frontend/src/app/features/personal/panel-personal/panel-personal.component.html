<div class="container pagina">
  <div class="encabezado-pagina">
    <div class="icono"><i class="bi bi-person-badge"></i></div>
    <div>
      <h1>Panel del personal</h1>
      <p>Gestiona la recepción, custodia y entrega de objetos en la UPeU.</p>
    </div>
  </div>

  <div class="row g-4">
    @for (m of modulos; track m.titulo) {
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex flex-column">
            <h5 class="text-upeu-primary mb-3"><i class="bi {{ m.icono }} me-1"></i> {{ m.titulo }}</h5>
            <p class="small text-muted flex-grow-1">{{ m.descripcion }}</p>
            @if (m.ruta) {
              <a class="btn btn-upeu w-100" [routerLink]="m.ruta">Abrir</a>
            } @else {
              <button class="btn btn-upeu w-100" disabled>Próximamente</button>
            }
          </div>
        </div>
      </div>
    }
  </div>
</div>
