spring:
  application:
    name: objetos_perdidos
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XE
    username: UPEU
    password: 123
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  servlet:
    context-path: /objetos_perdidos
  port: 8082

storage:
  location: "images"

security:
  jwt:
    secret-key: ${JWT_SECRET:}
    expiration-time: 120000
