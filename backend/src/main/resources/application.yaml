
spring:
  application:
    name: objetos_perdidos

  # Los servicios de imagen aceptan hasta 5 MB (por defecto Spring corta en 1 MB).
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: APP_UPEU
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        default_schema: UPEU_DATOS
        format_sql: true

server:
  servlet:
    context-path: /objetos_perdidos
  port: 8082

storage:
  location: "images"

security:
  jwt:
    secret-key: ${JWT_SECRET:}
    # 1 hora (en milisegundos)
    expiration-time: 3600000
  student:
    # Login ligero: el estudiante entra solo con codigo o DNI.
    # Si el estudiante tiene contrasena configurada, se le exige.
    allow-passwordless: true
