
spring:
  application:
    name: objetos_perdidos

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: APP_UPEU
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        default_schema: UPEU_DATOS
        format_sql: true

server:
  servlet:
    context-path: /objetos_perdidos
  port: 8082

storage:
  location: "images"

security:
  jwt:
    secret-key: ${JWT_SECRET:}
    expiration-time: 120000
